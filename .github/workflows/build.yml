name: Build Hawki Timer

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"

      - name: Build
        shell: bash
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"

          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang" \
            -O2 -std=gnu11 -static -fno-stack-protector -fno-pic \
            -ffunction-sections -fdata-sections hawki.c -o timer \
            -Wl,--gc-sections -Wl,-s -Wl,--build-id=none \
            -Wl,-z,norelro -pthread

          file timer
          readelf -h timer

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hawki-timer-arm64-api34
          path: timer
